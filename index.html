const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pw){
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveBits"]);
  const bits = new Uint8Array(await crypto.subtle.deriveBits(
    {name:"PBKDF2", hash:"SHA-256", salt:b64(P.salt), iterations:P.iter}, base, 640));
  const aesKey  = await crypto.subtle.importKey("raw", bits.slice(0,32), "AES-CBC", false, ["decrypt"]);
  const iv      = bits.slice(32,48);
  const macKey  = await crypto.subtle.importKey("raw", bits.slice(48,80),
                    {name:"HMAC", hash:"SHA-256"}, false, ["verify"]);
  const ct = b64(P.ct);
  if(!await crypto.subtle.verify("HMAC", macKey, b64(P.hmac), ct))
    throw new Error("bad passphrase");
  const pt = await crypto.subtle.decrypt({name:"AES-CBC", iv}, aesKey, ct);
  return new TextDecoder().decode(pt);
}
document.getElementById("f").addEventListener("submit", async ev=>{
  ev.preventDefault();
  const btn=document.getElementById("go"), err=document.getElementById("err");
  btn.disabled=true; err.textContent="Deriving key\u2026";
  try{
    const html = await unlock(document.getElementById("pw").value);
    document.open(); document.write(html); document.close();
  }catch(e){ err.textContent="Wrong passphrase."; btn.disabled=false; }
});
