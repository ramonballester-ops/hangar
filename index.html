  if(!await crypto.subtle.verify("HMAC", macKey, b64(PAYLOAD.hmac), ct))
    throw new Error("bad passphrase");
  const pt = await crypto.subtle.decrypt({name:"AES-CBC", iv}, aesKey, ct);
  return new TextDecoder().decode(pt);
}
// "Remember this device": Ramon's own devices keep the passphrase locally so
// the tab opens itself; the hosted copy stays locked for everyone else. A
// wrong/stale saved passphrase (e.g. after a passphrase change) self-clears.
const RKEY = "commuter_dash_pw";
async function go(pw, remember){
  const btn=document.getElementById("go"), err=document.getElementById("err");
  btn.disabled=true; err.textContent="Unlocking\u2026";
  try{
    const html = await unlock(pw);
    try{ if(remember) localStorage.setItem(RKEY, pw); }catch(_){}
    // Load into a FRESH document (clean JS scope + full load lifecycle).
    // document.write shares this page's scope and collides with the
    // dashboard's own top-level const declarations.
    location.replace(URL.createObjectURL(new Blob([html], {type:"text/html"})));
  }catch(e){
    try{ localStorage.removeItem(RKEY); }catch(_){}
    err.textContent="Wrong passphrase."; btn.disabled=false;
  }
}
document.getElementById("f").addEventListener("submit", ev=>{
  ev.preventDefault();
  go(document.getElementById("pw").value, document.getElementById("rm").checked);
});
try{
  const saved = localStorage.getItem(RKEY);
  if(saved) go(saved, true);
}catch(_){}
</script></body></html>
